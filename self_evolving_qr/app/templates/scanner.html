{% extends 'base.html' %}{% block heading %}Scan a QR code{% endblock %}{% block content %}<div class="scanner-layout"><section class="panel scanner"><div id="reader"><div class="scanner-placeholder"><i class="bi bi-camera"></i><h3>Camera scanner</h3><p>Camera integration is ready for a compatible device.</p><button class="btn btn-primary" onclick="startScanner()">Enable camera</button></div></div></section><section class="panel"><span class="eyebrow">MANUAL FALLBACK</span><h3>Enter a token</h3><p class="muted">Paste the full identification URL or token if a camera is unavailable.</p><form onsubmit="goToken(event)" class="stack-form"><input id="token" placeholder="https://.../identify/token" required><button class="btn btn-primary">Verify identity <i class="bi bi-arrow-right"></i></button></form></section></div><script>function goToken(e){e.preventDefault();let v=document.getElementById('token').value;let token=v.split('/').filter(Boolean).pop();location.href='/identify/'+token}</script>{% endblock %}
