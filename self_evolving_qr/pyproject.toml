[project]
name = "seqr"
version = "0.1.0"
description = "Flask application"
requires-python = ">=3.12,<3.13"

dependencies = [
    "Flask==3.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.2",
    "qrcode[pil]==8.0",
    "python-dotenv==1.0.1",
]

[tool.vercel]
entrypoint = "run:app"
